[package]
name = "markets"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
predictify-hybrid = { path = "../predictify-hybrid" }
proptest = "1.4"

[[test]]
name = "proptest"
path = "tests/proptest.rs"

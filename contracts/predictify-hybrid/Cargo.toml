[package]
name = "predictify-hybrid"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[features]
# "full" exposes every contract entry point (default). Build with
# --no-default-features for the slim build that fits the 128 KiB on-chain limit.
default = ["full"]
full = []

[dependencies]
wee_alloc = "0.4.5"
ethnum = "1.5.3"
soroban-sdk = { workspace = true }


# Disabled: pre-existing SDK incompatibilities
# [[test]]
# name = "datakey_collision"
# path = "tests/datakey_collision.rs"
#
# [[test]]
# name = "oracle_callback_fuzz"
# path = "tests/oracle_callback_fuzz.rs"

[[test]]
name = "err_stability"
path = "tests/err_stability.rs"

[[test]]
name = "stateful"
path = "tests/stateful.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"

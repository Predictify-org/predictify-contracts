[package]
name = "markets"
version = "0.0.0"
edition = "2021"
publish = false
description = "Markets contract + per-entrypoint gas snapshots (v7)"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false
path = "src/lib.rs"

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[[test]]
name = "gas_snap"
path = "tests/gas_snap.rs"

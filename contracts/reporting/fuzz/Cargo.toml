[package]
name = "reporting-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
soroban-sdk = { workspace = true, features = ["testutils"] }
reporting = { path = ".." }

[[bin]]
name = "main"
path = "targets/main.rs"
test = false
doc = false
bench = false

[package]
name = "resolution-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata.cargo-fuzz]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }
predictify-hybrid = { path = "../../predictify-hybrid" }
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[[bin]]
name = "main"
path = "targets/main.rs"

[package]
name = "predictify-analytics"
version = "0.1.0"
edition = "2021"
description = "Read-only analytics contract for Predictify, reading core views via cross-contract calls"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = []

[dependencies]
soroban-sdk = { workspace = true }
predictify-hybrid = { path = "../predictify-hybrid", features = ["full"] }

[depdevelopment-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"

[dev-dependencies]
predictify-hybrid = { path = "../predictify-hybrid", features = ["full", "testutils"] }

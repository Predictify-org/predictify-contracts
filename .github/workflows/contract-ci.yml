name: Soroban Smart Contracts CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p predictify-hybrid
      - name: Test stable crates
        run: cargo test -p hello-world -p oracles
      - name: Test predictify-hybrid
        run: cargo test -p predictify-hybrid --lib
      - name: Test predictify-analytics
        run: cargo test -p predictify-analytics
      - name: Build analytics WASM (size budget)
        run: ./scripts/build_analytics_wasm.sh
      - name: Slim (deployable) feature set compiles
        run: cargo check -p predictify-hybrid --no-default-features

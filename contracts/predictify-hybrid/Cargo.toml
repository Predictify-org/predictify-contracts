[package]
name = "predictify-hybrid"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
wee_alloc = "0.4.5"
ethnum = "1.5.3"
soroban-sdk = { workspace = true }


# Disabled: pre-existing SDK incompatibilities
# [[test]]
# name = "datakey_collision"
# path = "tests/datakey_collision.rs"
#
# [[test]]
# name = "oracle_callback_fuzz"
# path = "tests/oracle_callback_fuzz.rs"

[[test]]
name = "err_stability"
path = "tests/err_stability.rs"

# #867 — betting error-code stability: freezes client-facing Error discriminants
# for every error variant reachable from betting entrypoints.
[[test]]
name = "err_stab"
path = "tests/err_stab.rs"

# #859 — per-entrypoint auth snapshot: asserts which address each market
# entrypoint requires authorization from (admin, user, or none).
[[test]]
name = "auth_snap"
path = "tests/auth_snap.rs"

[[test]]
name = "auth_snapshot_betting"
path = "tests/auth_snapshot_betting.rs"

[[test]]
name = "stateful"
path = "tests/stateful.rs"

[[test]]
name = "vote_conserve"
path = "tests/vote_conserve.rs"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.4"
